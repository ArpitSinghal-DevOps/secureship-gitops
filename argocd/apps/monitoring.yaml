apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.4.1
    helm:
      valuesObject:
        alertmanager:
          enabled: false # trimmed for a laptop-sized cluster
        nodeExporter:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            # Pick up ServiceMonitors from every namespace, not only Helm-labelled ones.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        grafana:
          sidecar:
            dashboards:
              searchNamespace: ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
