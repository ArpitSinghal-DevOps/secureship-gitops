apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secureship
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ArpitSinghal-DevOps/secureship-gitops.git
    targetRevision: main
    path: chart/secureship
  destination:
    server: https://kubernetes.default.svc
    namespace: secureship
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
