# Baseline rules for every pod in the secureship namespace.
# Init containers are checked like app containers: an unchecked init container would be an easy
# way to run an unpinned or privileged image. Ephemeral debug containers are refused outright.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: secureship-pod-hardening
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: secureship
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # `kubectl debug` adds containers through the ephemeralcontainers subresource.
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: workloadContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: "!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0"
      message: "ephemeral (debug) containers are not allowed in this namespace"
    - expression: "variables.workloadContainers.all(c, c.image.contains('@sha256:'))"
      message: "images must be pinned by digest (no mutable tags such as :latest), including init containers"
    - expression: >-
        variables.workloadContainers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: "every container, including init containers, must set CPU and memory limits"
    - expression: >-
        variables.workloadContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false &&
          has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true)
      message: "containers, including init containers, must disable privilege escalation and use a read-only root filesystem"
    - expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) &&
          object.spec.securityContext.runAsNonRoot == true) ||
        variables.workloadContainers.all(c, has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: "pods must run as non-root"
