# Only images signed (keyless, Sigstore) by the secureship-app GitHub Actions workflow on the
# main branch, and carrying an SBOM attested by that same workflow, may run in the secureship
# namespace. Every container list is checked: app, init and ephemeral containers.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-secureship-signature
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions: [Deny]
  # Signature checks call GHCR, Rekor and the Sigstore TUF root; the 10s default is too
  # short for a cold cache. 30s is the Kubernetes maximum for admission webhooks.
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: secureship
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchImageReferences:
    - glob: "*"
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '(?i)^https://github\.com/ArpitSinghal-DevOps/secureship-app/\.github/workflows/ci\.yml@refs/heads/main$'
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://spdx.dev/Document # predicate type written by `cosign attest --type spdxjson`
  variables:
    - name: allImages
      expression: >-
        (object.spec.containers
          + object.spec.?initContainers.orValue([])
          + object.spec.?ephemeralContainers.orValue([])).map(c, c.image)
  validations:
    - expression: "variables.allImages.all(image, verifyImageSignatures(image, [attestors.github]) > 0)"
      message: "image is not signed by the secureship-app CI pipeline (main branch)"
    - expression: "variables.allImages.all(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.github]) > 0)"
      message: "image has no SPDX SBOM attested by the secureship-app CI pipeline (main branch)"
