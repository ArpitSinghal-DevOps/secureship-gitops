# The policies also match pods/ephemeralcontainers (that is how `kubectl debug` adds a container).
# Kyverno's reports controller needs read access to that subresource, otherwise the policies
# stay "not ready" and Argo CD reports them as Degraded. Aggregated into Kyverno's own role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:ephemeralcontainers
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "list", "watch"]
