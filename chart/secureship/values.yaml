replicaCount: 2
image:
  repository: ghcr.io/arpitsinghal-devops/secureship-app
  # Set automatically by the secureship-app pipeline after the image is signed.
  # Deploying by digest (not tag) means what was scanned and signed is exactly what runs.
  digest: "sha256:fc2e902329e011577d85778c540e2b4f91a922e3339dcd157d884b53d983dd18"
service:
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
# Monitoring runs in Docker next to the cluster (see monitoring/ and tools/monitoring).
# This creates the read-only ServiceAccount that Prometheus uses to scrape the pods.
metricsReader:
  enabled: true
# Only for the in-cluster alternative (argocd/optional/monitoring.yaml, needs more RAM).
serviceMonitor:
  enabled: false
dashboard:
  enabled: false
