replicaCount: 2
image:
  repository: ghcr.io/arpitsinghal-devops/secureship-app
  # Set automatically by the secureship-app pipeline after the image is signed.
  # Deploying by digest (not tag) means what was scanned and signed is exactly what runs.
  digest: "sha256:19fa7ff231b940f04a737762e8e68b833e386b6068bcc02364557391648722dc"
service:
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
# Monitoring is off by default to fit a 7-8 GB laptop. To turn it on:
#   git mv argocd/optional/monitoring.yaml argocd/apps/  and set both flags to true.
serviceMonitor:
  enabled: false
dashboard:
  enabled: false
